name: Rocky X Gate 1 Source Overlay CI

on:
  workflow_dispatch:
  push:
    branches:
      - gate1-domain-foundation-minfix-2026-09-23-1
    paths:
      - "app/src/main/java/com/rockyx/app/domain/training/**"
      - "rockyx_rev15_phase1_v8_sit_wedge_v1_integrated.zip"
      - ".github/workflows/gate1-source-overlay-ci.yml"

permissions:
  contents: read

jobs:
  gate1-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: gate1-domain-foundation-minfix-2026-09-23-1

      - name: Verify required Gate 1 source files
        shell: bash
        run: |
          set -euo pipefail
          BASE="app/src/main/java/com/rockyx/app/domain/training"
          files=(
            "SitSessionAggregator.kt"
            "SkillStateProjector.kt"
            "TrainingContractFoundation.kt"
            "TrainingDecisionEngine.kt"
            "TrainingModels.kt"
            "TrainingPolicyEngine.kt"
            "TrainingValidation.kt"
          )
          for f in "${files[@]}"; do
            test -s "$BASE/$f"
          done

      - name: Extract integrated Rocky X project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="rockyx_rev15_phase1_v8_sit_wedge_v1_integrated.zip"
          test -s "$ARCHIVE"
          rm -rf _ci
          mkdir -p _ci/project
          unzip -q "$ARCHIVE" -d _ci/project

          PROJECT_ROOT="$(find _ci/project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_ROOT"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          echo "PROJECT_ROOT=$PROJECT_ROOT" | tee _ci/project_root.txt

      - name: Overlay tracked Gate 1 domain foundation
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat _ci/project_root.txt)"
          SRC="app/src/main/java/com/rockyx/app/domain/training"
          DST="$PROJECT_ROOT/app/src/main/java/com/rockyx/app/domain/training"
          mkdir -p "$DST"
          cp "$SRC"/*.kt "$DST"/

          for f in "$SRC"/*.kt; do
            name="$(basename "$f")"
            test -s "$DST/$name"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run JVM tests
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat _ci/project_root.txt)"
          cd "$PROJECT_ROOT"
          gradle --no-daemon test

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat _ci/project_root.txt)"
          cd "$PROJECT_ROOT"
          gradle --no-daemon :app:assembleDebug

      - name: Build backend
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat _ci/project_root.txt)"
          cd "$PROJECT_ROOT"
          gradle --no-daemon :backend:build

      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat _ci/project_root.txt)"
          count="$(find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*.apk' | wc -l)"
          test "$count" -ge 1
          find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload Gate 1 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocky-x-gate1-debug-apk
          path: |
            _ci/project/**/app/build/outputs/apk/**/*.apk
            _ci/project/**/app/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 14
