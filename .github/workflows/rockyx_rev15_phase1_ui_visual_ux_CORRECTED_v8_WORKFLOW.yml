name: Rocky X Rev15 Phase1 v8 CI

on:
  workflow_dispatch:
  push:
    paths:
      - "rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip"
      - "app/src/main/java/com/rockyx/app/domain/training/**"
      - "app/src/test/java/com/rockyx/app/domain/training/**"
      - "app/src/main/java/com/rockyx/app/library/**"
      - "app/src/test/java/com/rockyx/app/library/**"
      - "tools/apply-library-foundation-overlay.py"
      - ".github/workflows/rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8_WORKFLOW.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Revision 15 Phase 1 v8 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip"
          test -f "$ARCHIVE"
          EXPECTED="03f26c9bb4b4dc2181b898138b638a756196398923cc7214b431edb1cfcbca6e"
          ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Extract and validate project layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rockyx-src
          mkdir rockyx-src
          ARCHIVE="rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip"
          unzip -q "$ARCHIVE" -d rockyx-src
          PROJECT_ROOT="rockyx-src/rev14src"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/backend/build.gradle.kts"
          test -f "$PROJECT_ROOT/tools/integration-check.sh"
          echo "Verified project root: $PROJECT_ROOT"

      - name: Overlay tracked Gate 1 domain foundation
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="rockyx-src/rev14src"
          SRC="app/src/main/java/com/rockyx/app/domain/training"
          DST="$PROJECT_ROOT/$SRC"

          required=(
            "SitSessionAggregator.kt"
            "SkillStateProjector.kt"
            "TrainingContractFoundation.kt"
            "TrainingDecisionEngine.kt"
            "TrainingModels.kt"
            "TrainingPolicyEngine.kt"
            "TrainingValidation.kt"
          )

          for f in "${required[@]}"; do
            test -s "$SRC/$f"
          done

          mkdir -p "$DST"
          cp "$SRC"/*.kt "$DST"/
          test -s "$SRC/TrainingDurableStore.kt"
          test -s "$SRC/TrainingPersistenceGateway.kt"

          for f in "${required[@]}"; do
            cmp -s "$SRC/$f" "$DST/$f"
          done

          LIB_SRC="app/src/main/java/com/rockyx/app/library"
          LIB_DST="$PROJECT_ROOT/$LIB_SRC"
          test -d "$LIB_SRC"
          mkdir -p "$LIB_DST"
          cp "$LIB_SRC"/*.kt "$LIB_DST"/
          test -s "$LIB_DST/LibraryModels.kt"
          test -s "$LIB_DST/LibraryCatalog.kt"
          test -s "$LIB_DST/LibraryRepository.kt"
          test -s "$LIB_DST/LibraryLocalStore.kt"
          test -s "$LIB_DST/LibraryService.kt"
          test -s "$LIB_DST/LibraryDownloadTracker.kt"

          LIB_TEST_SRC="app/src/test/java/com/rockyx/app/library"
          LIB_TEST_DST="$PROJECT_ROOT/$LIB_TEST_SRC"
          test -d "$LIB_TEST_SRC"
          mkdir -p "$LIB_TEST_DST"
          cp "$LIB_TEST_SRC"/*.kt "$LIB_TEST_DST"/
          test -s "$LIB_TEST_DST/LibraryCatalogTest.kt"
          test -s "$LIB_TEST_DST/LibraryLocalStoreTest.kt"

          TRAIN_TEST_SRC="app/src/test/java/com/rockyx/app/domain/training"
          TRAIN_TEST_DST="$PROJECT_ROOT/$TRAIN_TEST_SRC"
          mkdir -p "$TRAIN_TEST_DST"
          cp "$TRAIN_TEST_SRC"/*.kt "$TRAIN_TEST_DST"/
          test -s "$TRAIN_TEST_DST/TrainingDurableStoreTest.kt"

          echo "Gate 1 + Library tracked source overlay verified: ${#required[@]} training files + 4 library files + library tests"

      - name: Apply Library UI integration overlay
        run: python3 tools/apply-library-foundation-overlay.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Static integration checks
        working-directory: rockyx-src/rev14src
        run: bash tools/integration-check.sh

      - name: JVM tests
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon test

      - name: Android debug build
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon :app:assembleDebug

      - name: Backend distribution build
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon :backend:build

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_COUNT="$(find rockyx-src/rev14src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -ge 1
          find rockyx-src/rev14src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocky-x-gate1-v8-source-overlay-debug-apk
          path: rockyx-src/rev14src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
