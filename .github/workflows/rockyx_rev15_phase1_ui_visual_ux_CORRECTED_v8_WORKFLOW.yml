name: Rocky X Rev15 Phase1 v8 CI

on:
  workflow_dispatch:
  push:
    paths:
      - "rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip"
      - "app/src/main/java/com/rockyx/app/domain/training/**"
      - "app/src/test/java/com/rockyx/app/domain/training/**"
      - "app/src/main/java/com/rockyx/app/library/**"
      - "app/src/test/java/com/rockyx/app/library/**"
      - "tools/apply-library-foundation-overlay.py"
      - ".github/workflows/rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8_WORKFLOW.yml"

jobs:

  production_transport_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify and extract production source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip"
          test -f "$ARCHIVE"
          EXPECTED="03f26c9bb4b4dc2181b898138b638a756196398923cc7214b431edb1cfcbca6e"
          ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf audit-src
          mkdir audit-src
          unzip -q "$ARCHIVE" -d audit-src
          test -d audit-src/rev14src/backend

      - name: Audit production transport boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT="audit-src/rev14src"
          BACKEND="$ROOT/backend"
          REPORT="production-transport-audit.txt"
          {
            echo "ROCKY X — PRODUCTION TRANSPORT AUDIT"
            echo "HEAD: $GITHUB_SHA"
            echo
            echo "[BACKEND FILES]"
            find "$BACKEND" -type f | sort
            echo
            echo "[ROUTING / HTTP ENTRYPOINTS]"
            grep -RInE 'routing[[:space:]]*\{|route\(|get\(|post\(|put\(|patch\(|delete\(' "$BACKEND/src" || true
            echo
            echo "[SYNC IDENTIFIERS / CONTRACT REFERENCES]"
            grep -RInE 'TrainingSync|SyncEnvelope|SyncApplyResult|clientGeneratedId|ruleVersionId|policyVersionId|supersedesRecordId|basisEvaluationIds|applySync|appendSyncBatch' "$ROOT/app/src" "$BACKEND/src" || true
            echo
            echo "[AUTH / CREDENTIALS / REQUEST CONTEXT]"
            grep -RInE 'authenticate|authorization|bearer|jwt|token|principal|call\.principal' "$BACKEND/src" || true
            echo
            echo "[PERSISTENCE / TRANSACTION BOUNDARY]"
            grep -RInE 'transaction|beginTransaction|commit|rollback|Exposed|Database|SQLite|repository|DAO' "$BACKEND/src" || true
            echo
            echo "[NETWORK CLIENT / SERVER OUTBOUND]"
            grep -RInE 'HttpClient|OkHttp|Ktor|Retrofit|URLConnection|request\{|submitForm|http://' "$BACKEND/src" || true
            echo
            echo "[BACKEND TESTS]"
            find "$BACKEND/src/test" -type f 2>/dev/null | sort || true
            echo
            echo "[SYNC TEST REFERENCES]"
            grep -RInE 'sync|Sync' "$BACKEND/src/test" 2>/dev/null || true
          } > "$REPORT"
          cat "$REPORT"

      - name: Upload production transport audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocky-x-production-transport-audit
          path: |
            production-transport-audit.txt
            audit-src/rev14src/backend/src
            audit-src/rev14src/backend/build.gradle.kts
            audit-src/rev14src/settings.gradle.kts
          if-no-files-found: error
          retention-days: 14
  production_transport_integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rockyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rockyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ROCKYX_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/rockyx
      ROCKYX_DATABASE_USER: postgres
      ROCKYX_DATABASE_PASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract and validate project layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rockyx-src
          mkdir rockyx-src
          unzip -q rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip -d rockyx-src
          test -f rockyx-src/rev14src/backend/build.gradle.kts

      - name: Overlay tracked Production Training Sync transport
        run: python3 tools/apply-training-sync-transport-overlay.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run production transport PostgreSQL integration tests
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon :backend:test --tests com.rockyx.backend.TrainingSyncTransportPostgresIntegrationTest

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Revision 15 Phase 1 v8 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip"
          test -f "$ARCHIVE"
          EXPECTED="03f26c9bb4b4dc2181b898138b638a756196398923cc7214b431edb1cfcbca6e"
          ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Extract and validate project layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rockyx-src
          mkdir rockyx-src
          ARCHIVE="rockyx_rev15_phase1_ui_visual_ux_CORRECTED_v8.zip"
          unzip -q "$ARCHIVE" -d rockyx-src
          PROJECT_ROOT="rockyx-src/rev14src"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/backend/build.gradle.kts"
          test -f "$PROJECT_ROOT/tools/integration-check.sh"
          echo "Verified project root: $PROJECT_ROOT"

      - name: Overlay tracked Gate 1 domain foundation
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="rockyx-src/rev14src"
          SRC="app/src/main/java/com/rockyx/app/domain/training"
          DST="$PROJECT_ROOT/$SRC"

          required=(
            "SitSessionAggregator.kt"
            "SkillStateProjector.kt"
            "TrainingContractFoundation.kt"
            "TrainingDecisionEngine.kt"
            "TrainingModels.kt"
            "TrainingPolicyEngine.kt"
            "TrainingValidation.kt"
          )

          for f in "${required[@]}"; do
            test -s "$SRC/$f"
          done

          mkdir -p "$DST"
          cp "$SRC"/*.kt "$DST"/
          test -s "$SRC/TrainingDurableStore.kt"
          test -s "$SRC/TrainingPersistenceGateway.kt"

          for f in "${required[@]}"; do
            cmp -s "$SRC/$f" "$DST/$f"
          done

          LIB_SRC="app/src/main/java/com/rockyx/app/library"
          LIB_DST="$PROJECT_ROOT/$LIB_SRC"
          test -d "$LIB_SRC"
          mkdir -p "$LIB_DST"
          cp "$LIB_SRC"/*.kt "$LIB_DST"/
          test -s "$LIB_DST/LibraryModels.kt"
          test -s "$LIB_DST/LibraryCatalog.kt"
          test -s "$LIB_DST/LibraryRepository.kt"
          test -s "$LIB_DST/LibraryLocalStore.kt"
          test -s "$LIB_DST/LibraryService.kt"
          test -s "$LIB_DST/LibraryDownloadTracker.kt"

          LIB_TEST_SRC="app/src/test/java/com/rockyx/app/library"
          LIB_TEST_DST="$PROJECT_ROOT/$LIB_TEST_SRC"
          test -d "$LIB_TEST_SRC"
          mkdir -p "$LIB_TEST_DST"
          cp "$LIB_TEST_SRC"/*.kt "$LIB_TEST_DST"/
          test -s "$LIB_TEST_DST/LibraryCatalogTest.kt"
          test -s "$LIB_TEST_DST/LibraryLocalStoreTest.kt"

          TRAIN_TEST_SRC="app/src/test/java/com/rockyx/app/domain/training"
          TRAIN_TEST_DST="$PROJECT_ROOT/$TRAIN_TEST_SRC"
          mkdir -p "$TRAIN_TEST_DST"
          cp "$TRAIN_TEST_SRC"/*.kt "$TRAIN_TEST_DST"/
          test -s "$TRAIN_TEST_DST/TrainingDurableStoreTest.kt"
          test -s "$TRAIN_TEST_DST/TrainingPersistenceGatewayTest.kt"

          echo "Gate 1 + Library tracked source overlay verified: ${#required[@]} training files + 4 library files + library tests"

      - name: Apply Production Training Sync transport overlay
        run: python3 tools/apply-training-sync-transport-overlay.py

      - name: Apply Library UI integration overlay
        run: python3 tools/apply-library-foundation-overlay.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Static integration checks
        working-directory: rockyx-src/rev14src
        run: bash tools/integration-check.sh

      - name: JVM tests
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon test

      - name: Android debug build
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon :app:assembleDebug

      - name: Backend distribution build
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon :backend:build

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_COUNT="$(find rockyx-src/rev14src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -ge 1
          find rockyx-src/rev14src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocky-x-gate1-v8-source-overlay-debug-apk
          path: rockyx-src/rev14src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
