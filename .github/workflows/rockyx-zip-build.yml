name: Rocky X CI Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - "rockyx_rev7.zip"
      - ".github/workflows/rockyx-zip-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Revision 7 archive
        shell: bash
        run: |
          set -euo pipefail

          test -f rockyx_rev7.zip

          EXPECTED="8c040a3cee6254d8060e50d20abd182a9ebd51711f1efede97b2efa96219f441"
          ACTUAL="$(sha256sum rockyx_rev7.zip | awk '{print $1}')"

          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rockyx-src
          mkdir rockyx-src

          unzip -q rockyx_rev7.zip -d rockyx-src

          test -f rockyx-src/settings.gradle.kts
          test -f rockyx-src/app/build.gradle.kts
          test -f rockyx-src/tools/integration-check.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Static integration checks
        working-directory: rockyx-src
        run: bash tools/integration-check.sh

      - name: JVM tests
        working-directory: rockyx-src
        run: gradle --no-daemon test

      - name: Android debug build
        working-directory: rockyx-src
        run: gradle --no-daemon :app:assembleDebug

      - name: Backend distribution build
        working-directory: rockyx-src
        run: gradle --no-daemon :backend:build

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocky-x-debug-apk-v0.32.2-revision7
          path: rockyx-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
