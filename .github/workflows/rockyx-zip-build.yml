name: Rocky X CI Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - "rockyx_rev14.zip"
      - ".github/workflows/rockyx-zip-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Revision 14 archive
        shell: bash
        run: |
          set -euo pipefail

          test -f rockyx_rev14.zip

          EXPECTED="66c1ab29314ebc68acc4d180c69a52af65e5792b689fcbe4bf74d48ff302ea44"
          ACTUAL="$(sha256sum rockyx_rev14.zip | awk '{print $1}')"

          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

      - name: Extract and validate project layout
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rockyx-src
          mkdir rockyx-src

          unzip -q rockyx_rev14.zip -d rockyx-src

          PROJECT_ROOT="rockyx-src/rev14src"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/backend/build.gradle.kts"
          test -f "$PROJECT_ROOT/tools/integration-check.sh"

          echo "Verified project root: $PROJECT_ROOT"
          find "$PROJECT_ROOT" -maxdepth 1 -type f -print | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Static integration checks
        working-directory: rockyx-src/rev14src
        run: bash tools/integration-check.sh

      - name: JVM tests
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon test

      - name: Android debug build
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon :app:assembleDebug

      - name: Backend distribution build
        working-directory: rockyx-src/rev14src
        run: gradle --no-daemon :backend:build

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK_COUNT="$(find rockyx-src/rev14src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)"

          test "$APK_COUNT" -ge 1

          find rockyx-src/rev14src/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocky-x-debug-apk-v0.32.2-revision14
          path: rockyx-src/rev14src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
